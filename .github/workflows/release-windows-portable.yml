name: Release Windows Portable

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag whose tag-triggered full quality run passed
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: windows-portable-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  authorize:
    name: Authorize the exact tagged commit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      version: ${{ steps.source.outputs.version }}
      quality_run_id: ${{ steps.quality.outputs.run_id }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - name: Validate the tag and application version
        id: source
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $commit = (git rev-parse HEAD).Trim()
          $tagCommit = (git rev-list -n 1 $env:RELEASE_TAG).Trim()
          if ($commit -ne $tagCommit) { throw "Tag does not point to checked-out HEAD" }
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          if ($env:RELEASE_TAG -notmatch ("^v" + [regex]::Escape($version) + "(?:[-+].+)?$")) {
            throw "Tag $env:RELEASE_TAG does not match application version $version"
          }
          "commit=$commit" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
          "version=$version" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
      - name: Require a successful full quality run started by this tag
        id: quality
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          COMMIT_SHA: ${{ steps.source.outputs.commit }}
        run: |
          $response = gh api "repos/$env:GITHUB_REPOSITORY/actions/workflows/quality.yml/runs?event=push&status=success&head_sha=$env:COMMIT_SHA&per_page=100" | ConvertFrom-Json
          $run = $response.workflow_runs |
            Where-Object { $_.head_branch -eq $env:RELEASE_TAG -and $_.conclusion -eq "success" } |
            Sort-Object run_started_at -Descending |
            Select-Object -First 1
          if ($null -eq $run) { throw "No successful tag-triggered V2 Quality run exists for this commit" }
          $artifacts = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$($run.id)/artifacts" | ConvertFrom-Json
          $expectedName = "quality-gate-$env:COMMIT_SHA-$($run.run_attempt)"
          $artifact = $artifacts.artifacts | Where-Object { $_.name -eq $expectedName } | Select-Object -First 1
          if ($null -eq $artifact) { throw "Successful run has no exact quality-gate receipt" }
          New-Item -ItemType Directory -Path quality-receipt | Out-Null
          gh api $artifact.archive_download_url > quality-receipt.zip
          Expand-Archive -LiteralPath quality-receipt.zip -DestinationPath quality-receipt
          $receipt = Get-Content quality-receipt/quality-gate.json -Raw | ConvertFrom-Json
          if ($receipt.schema -ne "mediaflow-quality-gate/v1" -or
              $receipt.sha -ne $env:COMMIT_SHA -or
              $receipt.git_ref -ne "refs/tags/$env:RELEASE_TAG" -or
              $receipt.scope -ne "full" -or
              $receipt.passed -ne $true) {
            throw "Quality receipt does not authorize this exact tag, commit and full scope"
          }
          "run_id=$($run.id)" | Add-Content -LiteralPath $env:GITHUB_OUTPUT

  build-verify-release:
    name: Build, verify, then publish
    needs: authorize
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      PYTHONFAULTHANDLER: "1"
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
      MEDIAFLOW_MINIMUM_FREE_BYTES: "8589934592"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Configure isolated release paths
        shell: pwsh
        run: |
          $paths = @{
            MEDIAFLOW_DEV_ROOT = Join-Path $env:RUNNER_TEMP "mediaflow-dev"
            MEDIAFLOW_RUNTIME_DIR = Join-Path $env:RUNNER_TEMP "mediaflow-runtime"
            MEDIAFLOW_PROJECT_ROOT = Join-Path $env:RUNNER_TEMP "mediaflow-projects"
            MEDIAFLOW_MEDIA_ROOT = Join-Path $env:RUNNER_TEMP "mediaflow-media"
            MEDIAFLOW_TEST_ROOT = Join-Path $env:RUNNER_TEMP "mediaflow-test-runs"
            MEDIAFLOW_TEST_FIXTURE_ROOT = Join-Path $env:RUNNER_TEMP "mediaflow-test-fixtures"
            MEDIAFLOW_SERVICE_STATE_DIR = Join-Path $env:RUNNER_TEMP "mediaflow-service"
          }
          foreach ($entry in $paths.GetEnumerator()) {
            "$($entry.Key)=$($entry.Value)" | Add-Content -LiteralPath $env:GITHUB_ENV
          }
      - name: Restore the checksum-keyed Python environment
        id: python-environment
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/mediaflow-python
          key: mediaflow-python-v1-${{ runner.os }}-${{ runner.arch }}-3.12.10-${{ hashFiles('requirements.lock') }}
      - name: Prepare and activate the exact Python environment
        run: >-
          python scripts/ci/prepare_python_environment.py
          --environment "${{ runner.temp }}/mediaflow-python"
          --cache-hit "${{ steps.python-environment.outputs.cache-hit == 'true' }}"
      - name: Restore the pinned target runtime and Qt SDK
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ${{ env.MEDIAFLOW_RUNTIME_DIR }}/deps
            ${{ env.MEDIAFLOW_RUNTIME_DIR }}/downloads
            ${{ env.MEDIAFLOW_RUNTIME_DIR }}/qt
          key: mediaflow-release-runtime-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('runtime.lock.json') }}
      - name: Prepare the exact media, browser and Qt runtime
        shell: pwsh
        run: |
          python scripts/prepare_runtime.py --runtime-root $env:MEDIAFLOW_RUNTIME_DIR
          python scripts/prepare_ci_qt.py --qt-root (Join-Path $env:MEDIAFLOW_RUNTIME_DIR "qt")
          python scripts/build_native.py --runtime-root $env:MEDIAFLOW_RUNTIME_DIR
          python scripts/verify_development_runtime.py --profile core
      - name: Build and inventory the pristine portable directory
        id: portable
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $portableName = "MediaFlow-Pro-$env:RELEASE_TAG-portable-win64"
          $portableRoot = Join-Path $env:RUNNER_TEMP $portableName
          python scripts/build_windows_portable.py `
            --release-tag $env:RELEASE_TAG `
            --runtime-root $env:MEDIAFLOW_RUNTIME_DIR `
            --work-root (Join-Path $env:RUNNER_TEMP "portable-build-work") `
            --output-root $portableRoot
          "name=$portableName" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
          "root=$portableRoot" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
      - name: Exercise a separate copy through the complete offline user chain
        shell: pwsh
        run: |
          $validationRoot = Join-Path $env:RUNNER_TEMP "portable-validation-copy"
          Copy-Item -LiteralPath "${{ steps.portable.outputs.root }}" -Destination $validationRoot -Recurse
          python scripts/verify_windows_portable.py `
            --portable-root $validationRoot `
            --evidence-root (Join-Path $env:RUNNER_TEMP "portable-runtime-evidence")
      - name: Re-inventory the pristine directory and create the release archive
        id: archive
        shell: pwsh
        env:
          APP_VERSION: ${{ needs.authorize.outputs.version }}
        run: |
          $asset = Join-Path $env:RUNNER_TEMP ("${{ steps.portable.outputs.name }}.7z")
          $receipt = Join-Path $env:RUNNER_TEMP "portable-archive-receipt.json"
          python scripts/archive_windows_portable.py `
            --portable-root "${{ steps.portable.outputs.root }}" `
            --output $asset `
            --expected-version $env:APP_VERSION `
            --receipt $receipt
          "asset=$asset" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
          "receipt=$receipt" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
      - name: Upload release evidence before publication
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-portable-release-evidence-${{ needs.authorize.outputs.commit }}
          if-no-files-found: error
          retention-days: 30
          path: |
            ${{ runner.temp }}/portable-build-work/portable-distribution-report.json
            ${{ steps.archive.outputs.receipt }}
            ${{ env.MEDIAFLOW_TEST_ROOT }}
      - name: Publish only the already verified archive
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if (gh release view $env:RELEASE_TAG 2>$null) {
            throw "Release $env:RELEASE_TAG already exists; this workflow never overwrites it"
          }
          gh release create $env:RELEASE_TAG `
            "${{ steps.archive.outputs.asset }}#Windows portable archive" `
            "${{ steps.archive.outputs.receipt }}#Exact archive and source receipt" `
            --verify-tag `
            --title "MediaFlow Pro $env:RELEASE_TAG" `
            --generate-notes
