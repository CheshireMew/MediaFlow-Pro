name: V2 Quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python 3.12 architecture and user-chain checks
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install the exact reviewed dependency set
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Lint V2 source and verification scripts
        run: >-
          python -m ruff check
          mediaflow
          tests/v2
          scripts/update_qm_translations.py
          scripts/verify_display_capabilities.py
          scripts/verify_license_inventory.py
          scripts/verify_performance.py
          scripts/verify_preview_performance.py
          scripts/verify_real_user_chain.py
          scripts/verify_release_runtime.py
          scripts/verify_ui_matrix.py
      - name: Type-check core application and persistence boundaries
        run: python -m mypy
      - name: Verify pinned Python license inventory
        run: >-
          python scripts/verify_license_inventory.py
          --python-only
          --output-dir "${{ runner.temp }}"
      - name: Run hardware-independent V2 tests
        env:
          QT_QPA_PLATFORM: offscreen
          QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu
        run: python -m pytest tests/v2 -m "not integration and not slow"

  native-policy:
    name: Native preview source policy
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
      - name: Verify the native plugin stays isolated
        shell: pwsh
        run: |
          $forbidden = @(
            'project.mfp',
            'sqlite',
            'yt-dlp',
            '://'
          )
          foreach ($term in $forbidden) {
            $matches = Select-String -Path mediaflow/desktop/native/* -Pattern $term -SimpleMatch
            if ($matches) {
              $matches | Format-Table
              throw "Forbidden native-plugin responsibility found: $term"
            }
          }
