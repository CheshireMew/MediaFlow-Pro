name: V2 Quality

on:
  push:
  pull_request:
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:
    inputs:
      scope:
        description: Quality scope to run
        required: true
        default: full
        type: choice
        options:
          - maintenance
          - core
          - full

permissions:
  contents: read

concurrency:
  group: v2-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  plan:
    name: Select the required quality scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      scope: ${{ steps.plan.outputs.scope }}
      run_core: ${{ steps.plan.outputs.run_core }}
      run_full: ${{ steps.plan.outputs.run_full }}
      run_portable: ${{ steps.plan.outputs.run_portable }}
      changed_count: ${{ steps.plan.outputs.changed_count }}
      reason: ${{ steps.plan.outputs.reason }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Prove the classifier before consuming it
        run: python scripts/ci/quality_plan.py --self-test
      - name: Classify the commit range once
        id: plan
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          MANUAL_SCOPE: ${{ inputs.scope || 'full' }}
        run: >-
          python scripts/ci/quality_plan.py
          --event "$env:GITHUB_EVENT_NAME"
          --base "$env:BASE_SHA"
          --head "$env:GITHUB_SHA"
          --manual-scope "$env:MANUAL_SCOPE"
          --github-output "$env:GITHUB_OUTPUT"

  maintenance:
    name: Repository documentation and metadata
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install the hashed YAML maintenance dependency
        run: python scripts/ci/install_maintenance_tools.py
      - name: Parse every workflow before accepting metadata-only changes
        run: >-
          python -c "from pathlib import Path; import yaml;
          [yaml.safe_load(path.read_text(encoding='utf-8'))
          for path in Path('.github/workflows').glob('*.y*ml')]"
      - name: Verify documentation, images, and license links
        run: python scripts/ci/verify_repository_docs.py
      - name: Verify deterministic test partitioning
        run: python scripts/ci/test_shard.py --self-test

  preflight:
    name: Fast source and environment preflight
    needs: plan
    if: needs.plan.outputs.run_core == 'true'
    runs-on: windows-latest
    timeout-minutes: 8
    env:
      PYTHONFAULTHANDLER: "1"
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install the hashed YAML maintenance dependency
        run: python scripts/ci/install_maintenance_tools.py
      - name: Reject syntax and workflow errors before runtime setup
        run: |
          python -m compileall -q mediaflow scripts tests/v2
          python -c "from pathlib import Path; import yaml; [yaml.safe_load(path.read_text(encoding='utf-8')) for path in Path('.github/workflows').glob('*.y*ml')]"
      - name: Install the exact reviewed dependency set
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Lint V2 source and verification scripts
        run: >-
          python -m ruff check
          mediaflow
          tests/v2
          scripts/ci
          scripts/update_qm_translations.py
          scripts/prepare_ci_qt.py
          scripts/verify_display_capabilities.py
          scripts/verify_development_runtime.py
          scripts/verify_license_inventory.py
          scripts/verify_performance.py
          scripts/verify_preview_performance.py
          scripts/verify_reference_comparison_chain.py
          scripts/verify_real_user_chain.py
          scripts/verify_release_runtime.py
          scripts/verify_ui_matrix.py
          scripts/verify_web_render_performance.py
      - name: Type-check core application and persistence boundaries
        run: python -m mypy
      - name: Run CI, environment, path, and CLI contract tests first
        run: >-
          python -m pytest
          tests/v2/architecture/test_ci_quality_plan.py
          tests/v2/architecture/test_ci_runtime.py
          tests/v2/infrastructure/test_environment.py
          tests/v2/application/test_cli_process.py
          --durations=25

  core-tests:
    name: Core tests shard ${{ matrix.shard }} of 4
    needs:
      - plan
      - preflight
    if: needs.plan.outputs.run_core == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      PYTHONFAULTHANDLER: "1"
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
      QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Configure isolated repository paths
        shell: pwsh
        run: |
          $paths = @{
            MEDIAFLOW_DEV_ROOT = Join-Path $env:RUNNER_TEMP "mediaflow-dev"
            MEDIAFLOW_RUNTIME_DIR = Join-Path $env:RUNNER_TEMP "mediaflow-runtime"
            MEDIAFLOW_PROJECT_ROOT = Join-Path $env:RUNNER_TEMP "mediaflow-projects"
            MEDIAFLOW_MEDIA_ROOT = Join-Path $env:RUNNER_TEMP "mediaflow-media"
            MEDIAFLOW_TEST_ROOT = Join-Path $env:RUNNER_TEMP "mediaflow-test-runs"
            MEDIAFLOW_TEST_FIXTURE_ROOT = Join-Path $env:RUNNER_TEMP "mediaflow-test-fixtures"
            MEDIAFLOW_SERVICE_STATE_DIR = Join-Path $env:RUNNER_TEMP "mediaflow-service"
          }
          foreach ($entry in $paths.GetEnumerator()) {
            "$($entry.Key)=$($entry.Value)" | Add-Content -LiteralPath $env:GITHUB_ENV
          }
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install the exact reviewed dependency set
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Restore pinned media and Chromium dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ${{ runner.temp }}\mediaflow-runtime\deps
            ${{ runner.temp }}\mediaflow-runtime\downloads
          key: mediaflow-deps-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('runtime.lock.json') }}
      - name: Restore the checksum-pinned Qt SDK
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}\mediaflow-runtime\qt
          key: mediaflow-qt-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('runtime.lock.json') }}
      - name: Restore the native preview build
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}\mediaflow-runtime\native
          key: mediaflow-native-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('runtime.lock.json', 'requirements.lock', 'scripts/build_native.py', 'mediaflow/desktop/native/**') }}
      - name: Prepare the checksum-pinned media and Chromium runtime
        run: python scripts/prepare_runtime.py --runtime-root "$env:MEDIAFLOW_RUNTIME_DIR"
      - name: Install the exact Qt SDK declared by the runtime lock
        run: python scripts/prepare_ci_qt.py --qt-root "$env:MEDIAFLOW_RUNTIME_DIR\qt"
      - name: Build the native preview plugin against the pinned Qt SDK
        run: python scripts/build_native.py --runtime-root "$env:MEDIAFLOW_RUNTIME_DIR"
      - name: Run one deterministic hardware-independent shard
        run: >-
          python scripts/ci/test_shard.py
          --shard-index ${{ matrix.shard }}
          --shard-count 4
          --marker "not integration and not slow"
          --timings-file scripts/ci/test_timings.windows.json
          --exclude-file tests/v2/architecture/test_ci_quality_plan.py
          --exclude-file tests/v2/architecture/test_ci_runtime.py
          --exclude-file tests/v2/infrastructure/test_environment.py
          --exclude-file tests/v2/application/test_cli_process.py
          --run --
          --durations=25
      - name: Upload core-test failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: core-${{ matrix.shard }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            ${{ env.MEDIAFLOW_TEST_ROOT }}
            ${{ env.MEDIAFLOW_SERVICE_STATE_DIR }}
            ${{ runner.temp }}\*.log

  python:
    name: Windows ${{ matrix.scenario }} acceptance
    needs:
      - plan
      - preflight
    if: needs.plan.outputs.run_full == 'true'
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - interactive
          - offline
    env:
      PYTHONFAULTHANDLER: "1"
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
      QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Configure isolated repository paths
        shell: pwsh
        run: |
          $paths = @{
            MEDIAFLOW_DEV_ROOT = Join-Path $env:RUNNER_TEMP "mediaflow-dev"
            MEDIAFLOW_RUNTIME_DIR = Join-Path $env:RUNNER_TEMP "mediaflow-runtime"
            MEDIAFLOW_PROJECT_ROOT = Join-Path $env:RUNNER_TEMP "mediaflow-projects"
            MEDIAFLOW_MEDIA_ROOT = Join-Path $env:RUNNER_TEMP "mediaflow-media"
            MEDIAFLOW_TEST_ROOT = Join-Path $env:RUNNER_TEMP "mediaflow-test-runs"
            MEDIAFLOW_TEST_FIXTURE_ROOT = Join-Path $env:RUNNER_TEMP "mediaflow-test-fixtures"
            MEDIAFLOW_SERVICE_STATE_DIR = Join-Path $env:RUNNER_TEMP "mediaflow-service"
          }
          foreach ($entry in $paths.GetEnumerator()) {
            "$($entry.Key)=$($entry.Value)" | Add-Content -LiteralPath $env:GITHUB_ENV
          }
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install the exact reviewed dependency set
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Restore pinned media and Chromium dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ${{ runner.temp }}\mediaflow-runtime\deps
            ${{ runner.temp }}\mediaflow-runtime\downloads
          key: mediaflow-deps-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('runtime.lock.json') }}
      - name: Restore the checksum-pinned Qt SDK
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}\mediaflow-runtime\qt
          key: mediaflow-qt-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('runtime.lock.json') }}
      - name: Restore the native preview build
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}\mediaflow-runtime\native
          key: mediaflow-native-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('runtime.lock.json', 'requirements.lock', 'scripts/build_native.py', 'mediaflow/desktop/native/**') }}
      - name: Prepare the checksum-pinned media and Chromium runtime
        shell: pwsh
        run: |
          python scripts/prepare_runtime.py --runtime-root $env:MEDIAFLOW_RUNTIME_DIR
          if ($LASTEXITCODE -ne 0) { throw "Checksum-pinned runtime installation failed" }
      - name: Install the exact Qt SDK declared by the runtime lock
        shell: pwsh
        run: |
          python scripts/prepare_ci_qt.py --qt-root (Join-Path $env:MEDIAFLOW_RUNTIME_DIR "qt")
          if ($LASTEXITCODE -ne 0) { throw "Checksum-pinned Qt SDK installation failed" }
      - name: Build the native preview plugin against the pinned Qt SDK
        shell: pwsh
        run: |
          python scripts/build_native.py --runtime-root $env:MEDIAFLOW_RUNTIME_DIR
          if ($LASTEXITCODE -ne 0) { throw "Native preview build failed" }
      - name: Verify the installed media runtime contract
        if: matrix.scenario == 'interactive'
        run: python scripts/verify_development_runtime.py --profile core
      - name: Verify native QML loading on the CI display backend
        if: matrix.scenario == 'interactive'
        run: python scripts/verify_display_capabilities.py
      - name: Verify the complete pinned license inventory
        if: matrix.scenario == 'offline'
        run: >-
          python scripts/verify_license_inventory.py
          --output-dir "${{ runner.temp }}"
      - name: Run the full Qt desktop user chain in an isolated process
        if: matrix.scenario == 'interactive'
        run: >-
          python -m pytest
          tests/v2/desktop/test_qml_smoke.py::test_qml_real_project_chain_is_visible_in_models
      - name: Run the real media drag and scrub chain in an isolated process
        if: matrix.scenario == 'interactive'
        run: >-
          python -m pytest
          tests/v2/desktop/test_qml_smoke.py::test_drag_import_placement_snap_tracks_and_first_video_profile
      - name: Run each editable web desktop scenario in a fresh process
        if: matrix.scenario == 'interactive'
        run: |
          python -m pytest tests/v2/desktop/test_web_editor.py::test_unified_import_opens_the_v5_package_through_local_preview_server
          python -m pytest tests/v2/desktop/test_web_editor.py::test_real_dom_drag_crosses_webchannel_persists_and_is_read_back_by_page
      - name: Run real Chromium and native MLT integration tests
        if: matrix.scenario == 'interactive'
        run: >-
          python -m pytest
          tests/v2/infrastructure/test_web_capture_engine.py::test_real_draw_element_failure_requires_clean_screenshot_retry
          tests/v2/integration/test_native_preview.py
      - name: Run the offline application acceptance checks
        if: matrix.scenario == 'offline'
        run: |
          python -m scripts.verify_performance
          python -m scripts.verify_preview_performance --duration-seconds 20 --playback-check-seconds 5
          python -m scripts.verify_ui_matrix
          python -m scripts.verify_web_render_performance
          python -m scripts.verify_reference_comparison_chain --package tests/fixtures/editable-media-v5
      - name: Run the credentialed online user chain
        if: matrix.scenario == 'offline' && vars.MEDIAFLOW_RUN_ONLINE_E2E == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MEDIAFLOW_E2E_MODEL: ${{ vars.MEDIAFLOW_E2E_MODEL }}
        run: python -m scripts.verify_real_user_chain
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-${{ matrix.scenario }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            ${{ env.MEDIAFLOW_TEST_ROOT }}
            ${{ env.MEDIAFLOW_SERVICE_STATE_DIR }}
            ${{ runner.temp }}\*.log

  native-policy:
    name: Native preview source policy
    needs: plan
    if: needs.plan.outputs.run_full == 'true'
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify the native plugin stays isolated
        shell: pwsh
        run: |
          $forbidden = @(
            'project.mfp',
            'sqlite',
            'yt-dlp',
            '://'
          )
          foreach ($term in $forbidden) {
            $matches = Select-String -Path mediaflow/desktop/native/* -Pattern $term -SimpleMatch
            if ($matches) {
              $matches | Format-Table
              throw "Forbidden native-plugin responsibility found: $term"
            }
          }

  portable-core:
    name: ${{ matrix.name }} source-build core
    needs:
      - plan
      - preflight
    if: needs.plan.outputs.run_portable == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 24.04 x64 Wayland/X11
            os: ubuntu-24.04
            target: linux-x86_64
          - name: macOS 14 arm64
            os: macos-14
            target: macos-arm64
    env:
      PYTHONFAULTHANDLER: "1"
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Configure isolated portable paths
        shell: pwsh
        run: |
          $paths = @{
            MEDIAFLOW_DEV_ROOT = Join-Path $env:RUNNER_TEMP "mediaflow-dev"
            MEDIAFLOW_RUNTIME_DIR = Join-Path $env:RUNNER_TEMP "mediaflow-runtime"
            MEDIAFLOW_PROJECT_ROOT = Join-Path $env:RUNNER_TEMP "mediaflow-projects"
            MEDIAFLOW_MEDIA_ROOT = Join-Path $env:RUNNER_TEMP "mediaflow-media"
            MEDIAFLOW_TEST_ROOT = Join-Path $env:RUNNER_TEMP "mediaflow-test-runs"
            MEDIAFLOW_TEST_FIXTURE_ROOT = Join-Path $env:RUNNER_TEMP "mediaflow-test-fixtures"
            MEDIAFLOW_SERVICE_STATE_DIR = Join-Path $env:RUNNER_TEMP "mediaflow-service"
          }
          foreach ($entry in $paths.GetEnumerator()) {
            "$($entry.Key)=$($entry.Value)" | Add-Content -LiteralPath $env:GITHUB_ENV
          }
      - name: Install exact Python dependencies
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Restore target media and Chromium dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ${{ runner.temp }}/mediaflow-runtime/deps
            ${{ runner.temp }}/mediaflow-runtime/downloads
          key: mediaflow-deps-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('runtime.lock.json') }}
      - name: Restore the target Qt SDK
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/mediaflow-runtime/qt
          key: mediaflow-qt-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('runtime.lock.json') }}
      - name: Restore the target native preview build
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/mediaflow-runtime/native
          key: mediaflow-native-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('runtime.lock.json', 'requirements.lock', 'scripts/build_native.py', 'mediaflow/desktop/native/**') }}
      - name: Install Linux system libraries required by pinned Chromium
        if: runner.os == 'Linux'
        run: |
          python -m playwright install-deps chromium
          sudo apt-get update
          sudo apt-get install -y weston xvfb
      - name: Prepare the exact target media and Chromium runtime
        run: python scripts/prepare_runtime.py --runtime-root "${{ env.MEDIAFLOW_RUNTIME_DIR }}"
      - name: Install the target Qt SDK
        run: python scripts/prepare_ci_qt.py --qt-root "${{ env.MEDIAFLOW_RUNTIME_DIR }}/qt"
      - name: Build the native QML plugin from source
        run: python scripts/build_native.py --runtime-root "${{ env.MEDIAFLOW_RUNTIME_DIR }}"
      - name: Verify the platform runtime and native QML package
        run: python scripts/verify_development_runtime.py --profile core
      - name: Prove the runner architecture matches the reviewed target
        env:
          EXPECTED_TARGET: ${{ matrix.target }}
        run: >-
          python -c "import os; from mediaflow.infrastructure.runtime_contract import PlatformTarget;
          actual=PlatformTarget.current().key; expected=os.environ['EXPECTED_TARGET'];
          assert actual == expected, f'runner target {actual} != reviewed target {expected}'"
      - name: Exercise the native QML item through X11
        if: runner.os == 'Linux'
        shell: bash
        run: xvfb-run -a env QT_QPA_PLATFORM=xcb python scripts/verify_display_capabilities.py
      - name: Exercise the native QML item through Wayland
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/mediaflow-weston"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          weston --backend=headless-backend.so --socket=mediaflow-wayland --idle-time=0 >"$RUNNER_TEMP/weston.log" 2>&1 &
          weston_pid=$!
          trap 'kill "$weston_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 100); do
            test -S "$XDG_RUNTIME_DIR/mediaflow-wayland" && break
            sleep 0.1
          done
          test -S "$XDG_RUNTIME_DIR/mediaflow-wayland"
          WAYLAND_DISPLAY=mediaflow-wayland QT_QPA_PLATFORM=wayland python scripts/verify_display_capabilities.py
      - name: Verify portable contracts and service core
        run: >-
          python -m pytest
          tests/v2/architecture/test_ci_runtime.py
          tests/v2/application/test_editor_service.py
          tests/v2/application/test_mcp_server.py
          tests/v2/domain
          tests/v2/application/test_automation_commit_boundaries.py
      - name: Type-check on the actual target platform
        run: python -m mypy
      - name: Run the real CLI, Chromium, and native-preview chains
        run: >-
          python -m pytest
          tests/v2/application/test_cli_process.py
          tests/v2/infrastructure/test_web_media.py::test_v5_cli_chain
          tests/v2/integration/test_native_preview.py
      - name: Upload portable failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: portable-${{ runner.os }}-${{ runner.arch }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            ${{ env.MEDIAFLOW_TEST_ROOT }}
            ${{ env.MEDIAFLOW_SERVICE_STATE_DIR }}
            ${{ runner.temp }}/*.log

  interchange-produce:
    name: Produce ${{ matrix.target }} project interchange artifact
    needs:
      - plan
      - preflight
    if: needs.plan.outputs.run_portable == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x86_64
          - os: ubuntu-24.04
            target: linux-x86_64
          - os: macos-14
            target: macos-arm64
    env:
      PYTHONFAULTHANDLER: "1"
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Configure isolated producer paths
        shell: pwsh
        run: |
          $paths = @{
            MEDIAFLOW_RUNTIME_DIR = Join-Path $env:RUNNER_TEMP "mediaflow-runtime"
            MEDIAFLOW_PROJECT_ROOT = Join-Path $env:RUNNER_TEMP "mediaflow-projects"
            MEDIAFLOW_MEDIA_ROOT = Join-Path $env:RUNNER_TEMP "mediaflow-media"
            MEDIAFLOW_TEST_ROOT = Join-Path $env:RUNNER_TEMP "mediaflow-test-runs"
            MEDIAFLOW_SERVICE_STATE_DIR = Join-Path $env:RUNNER_TEMP "mediaflow-service"
          }
          foreach ($entry in $paths.GetEnumerator()) {
            "$($entry.Key)=$($entry.Value)" | Add-Content -LiteralPath $env:GITHUB_ENV
          }
      - name: Install exact Python dependencies
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Restore the reviewed target runtime
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ${{ runner.temp }}/mediaflow-runtime/deps
            ${{ runner.temp }}/mediaflow-runtime/downloads
          key: mediaflow-deps-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('runtime.lock.json') }}
      - name: Install Linux libraries required by the reviewed MLT runtime
        if: runner.os == 'Linux'
        run: python -m playwright install-deps chromium
      - name: Prepare the exact target runtime
        run: python scripts/prepare_runtime.py --runtime-root "${{ env.MEDIAFLOW_RUNTIME_DIR }}"
      - name: Prove the producer architecture
        env:
          EXPECTED_TARGET: ${{ matrix.target }}
        run: >-
          python -c "import os; from mediaflow.infrastructure.runtime_contract import PlatformTarget;
          actual=PlatformTarget.current().key; expected=os.environ['EXPECTED_TARGET'];
          assert actual == expected, f'runner target {actual} != reviewed target {expected}'"
      - name: Produce a real project, history, bundled-font subtitle, and reference export
        run: >-
          python -m scripts.verify_project_interchange produce
          --platform "${{ matrix.target }}"
          --bundle "${{ runner.temp }}/interchange-bundle"
          --work-root "${{ runner.temp }}/interchange-producer-work"
      - name: Upload the platform project artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: interchange-${{ matrix.target }}
          path: ${{ runner.temp }}/interchange-bundle
          if-no-files-found: error
          retention-days: 7

  interchange-consume:
    name: Interchange ${{ matrix.producer }} to ${{ matrix.consumer }}
    needs:
      - plan
      - interchange-produce
    if: needs.plan.outputs.run_portable == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            producer: windows-x86_64
            consumer: linux-x86_64
          - os: macos-14
            producer: windows-x86_64
            consumer: macos-arm64
          - os: windows-latest
            producer: linux-x86_64
            consumer: windows-x86_64
          - os: macos-14
            producer: linux-x86_64
            consumer: macos-arm64
          - os: windows-latest
            producer: macos-arm64
            consumer: windows-x86_64
          - os: ubuntu-24.04
            producer: macos-arm64
            consumer: linux-x86_64
    env:
      PYTHONFAULTHANDLER: "1"
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Configure isolated consumer paths
        shell: pwsh
        run: |
          $paths = @{
            MEDIAFLOW_RUNTIME_DIR = Join-Path $env:RUNNER_TEMP "mediaflow-runtime"
            MEDIAFLOW_PROJECT_ROOT = Join-Path $env:RUNNER_TEMP "mediaflow-projects"
            MEDIAFLOW_MEDIA_ROOT = Join-Path $env:RUNNER_TEMP "mediaflow-media"
            MEDIAFLOW_TEST_ROOT = Join-Path $env:RUNNER_TEMP "mediaflow-test-runs"
            MEDIAFLOW_SERVICE_STATE_DIR = Join-Path $env:RUNNER_TEMP "mediaflow-service"
          }
          foreach ($entry in $paths.GetEnumerator()) {
            "$($entry.Key)=$($entry.Value)" | Add-Content -LiteralPath $env:GITHUB_ENV
          }
      - name: Install exact Python dependencies
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Restore the reviewed consumer runtime
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ${{ runner.temp }}/mediaflow-runtime/deps
            ${{ runner.temp }}/mediaflow-runtime/downloads
          key: mediaflow-deps-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('runtime.lock.json') }}
      - name: Install Linux libraries required by the reviewed MLT runtime
        if: runner.os == 'Linux'
        run: python -m playwright install-deps chromium
      - name: Prepare the exact consumer runtime
        run: python scripts/prepare_runtime.py --runtime-root "${{ env.MEDIAFLOW_RUNTIME_DIR }}"
      - name: Download the foreign project artifact
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: interchange-${{ matrix.producer }}
          path: ${{ runner.temp }}/interchange-bundle
      - name: Open, undo, redo, relink, edit, export, and compare the foreign project
        run: >-
          python -m scripts.verify_project_interchange consume
          --producer "${{ matrix.producer }}"
          --consumer "${{ matrix.consumer }}"
          --bundle "${{ runner.temp }}/interchange-bundle"
          --work-root "${{ runner.temp }}/interchange-consumer-work"
      - name: Upload interchange diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: interchange-result-${{ matrix.producer }}-to-${{ matrix.consumer }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            ${{ runner.temp }}/interchange-consumer-work
            ${{ env.MEDIAFLOW_SERVICE_STATE_DIR }}

  quality-gate:
    name: V2 quality gate
    if: always()
    needs:
      - plan
      - maintenance
      - preflight
      - core-tests
      - python
      - native-policy
      - portable-core
      - interchange-produce
      - interchange-consume
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Require every selected boundary to pass
        shell: pwsh
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          MAINTENANCE_RESULT: ${{ needs.maintenance.result }}
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          CORE_RESULT: ${{ needs.core-tests.result }}
          FULL_RESULT: ${{ needs.python.result }}
          NATIVE_POLICY_RESULT: ${{ needs.native-policy.result }}
          PORTABLE_RESULT: ${{ needs.portable-core.result }}
          INTERCHANGE_PRODUCE_RESULT: ${{ needs.interchange-produce.result }}
          INTERCHANGE_CONSUME_RESULT: ${{ needs.interchange-consume.result }}
          RUN_CORE: ${{ needs.plan.outputs.run_core }}
          RUN_FULL: ${{ needs.plan.outputs.run_full }}
          RUN_PORTABLE: ${{ needs.plan.outputs.run_portable }}
        run: |
          $failures = [System.Collections.Generic.List[string]]::new()
          if ($env:PLAN_RESULT -ne "success") { $failures.Add("plan=$env:PLAN_RESULT") }
          if ($env:MAINTENANCE_RESULT -ne "success") { $failures.Add("maintenance=$env:MAINTENANCE_RESULT") }
          if ($env:RUN_CORE -eq "true") {
            if ($env:PREFLIGHT_RESULT -ne "success") { $failures.Add("preflight=$env:PREFLIGHT_RESULT") }
            if ($env:CORE_RESULT -ne "success") { $failures.Add("core=$env:CORE_RESULT") }
          }
          if ($env:RUN_FULL -eq "true") {
            if ($env:FULL_RESULT -ne "success") { $failures.Add("windows-full=$env:FULL_RESULT") }
            if ($env:NATIVE_POLICY_RESULT -ne "success") { $failures.Add("native-policy=$env:NATIVE_POLICY_RESULT") }
          }
          if ($env:RUN_PORTABLE -eq "true" -and $env:PORTABLE_RESULT -ne "success") {
            $failures.Add("portable=$env:PORTABLE_RESULT")
          }
          if ($env:RUN_PORTABLE -eq "true") {
            if ($env:INTERCHANGE_PRODUCE_RESULT -ne "success") {
              $failures.Add("interchange-produce=$env:INTERCHANGE_PRODUCE_RESULT")
            }
            if ($env:INTERCHANGE_CONSUME_RESULT -ne "success") {
              $failures.Add("interchange-consume=$env:INTERCHANGE_CONSUME_RESULT")
            }
          }
          if ($failures.Count -gt 0) {
            throw "Selected quality boundaries failed: $($failures -join ', ')"
          }
          "Selected quality boundaries passed." | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
