[project]
name = "mediaflow-pro"
version = "2.0.0"
description = "Cross-platform project-based video creation workstation built with PySide6/QML and MLT."
authors = [
    {name = "Weifeng"},
]
requires-python = ">=3.12,<3.13"
license = "GPL-3.0-only"
dependencies = [
    "PySide6==6.11.1",
    "pydantic==2.13.4",
    "yt-dlp==2026.3.17",
    "faster-whisper==1.2.1",
    "openai==2.45.0",
    "json-repair==0.61.4",
    "playwright==1.61.0",
    "opencv-python-headless==5.0.0.93",
    "av==18.0.0",
    "aiohttp==3.14.2",
    "psutil==7.2.2",
    "mcp==2.0.0",
    "pywin32==312; sys_platform == 'win32'",
]
readme = "README.md"

[project.scripts]
mediaflow-pro = "mediaflow.desktop.bootstrap:main"
mediaflow-cli = "mediaflow.cli:main"
mediaflow-service = "mediaflow.service.__main__:main"
mediaflow-mcp = "mediaflow.mcp_server:main"

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-qt==4.5.0",
    "ruff==0.14.14",
    "mypy==2.3.0",
]
build = [
    "aqtinstall==3.3.0",
    "cmake==4.4.0",
    "macholib==1.16.4",
    "ninja==1.13.0",
    "py7zr==1.1.3",
    "pyinstaller==6.22.2",
    "pdm-backend==2.4.9",
    "pip-tools==7.6.0",
]

[build-system]
requires = ["pdm-backend==2.4.9"]
build-backend = "pdm.backend"

[tool.pdm]
distribution = true

[tool.pdm.build]
includes = ["mediaflow"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests/v2"]
python_files = ["test_*.py"]
addopts = ["-v", "--strict-markers"]
markers = [
    "integration: requires external services or real files",
    "slow: tests that take more than 10 seconds",
]

[tool.ruff]
target-version = "py312"
line-length = 110
extend-exclude = ["archive", "tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
files = ["mediaflow"]
ignore_missing_imports = true
check_untyped_defs = true
disable_error_code = ["prop-decorator"]

[[tool.mypy.overrides]]
module = [
    "mediaflow.application.dubbing_editing",
    "mediaflow.application.highlight_service",
    "mediaflow.application.subtitle_editing",
    "mediaflow.application.translation_comparison",
    "mediaflow.desktop.controllers.subtitle_translation_controller",
    "mediaflow.desktop.service_wait",
    "mediaflow.editor_project_delivery_commands",
    "mediaflow.editor_project_document_commands",
    "mediaflow.editor_project_media_commands",
    "mediaflow.editor_project_script_timeline_commands",
    "mediaflow.editor_project_task_commands",
    "mediaflow.editor_project_web_commands",
    "mediaflow.infrastructure.project_repository",
    "mediaflow.infrastructure.project_repository_assembly",
    "mediaflow.service.client",
    "mediaflow.service.commands",
    "mediaflow.service.execution",
    "mediaflow.service.remote_project",
    "mediaflow.service.request_dispatcher",
    "mediaflow.service.session_registry",
]
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
warn_unused_ignores = true
warn_return_any = true
implicit_reexport = false
strict_equality = true
extra_checks = true
